name: CI

# GitHub-hosted runners may not allow every sandbox feature (user namespaces,
# Landlock, seccomp user-notify). Tests that cannot run must print
# "SKIPPED: <reason>" visibly; they must never pass silently. Do not treat a
# hosted-runner limitation as evidence that a protection is broken or works.
"on":
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Cargo does not build another package's binary for integration tests.
      - name: Build test helper
        run: cargo build --workspace --bins
      # --nocapture keeps SKIPPED lines visible on hosted runners.
      - name: Tests
        run: |
          set -o pipefail
          cargo test --workspace -- --nocapture 2>&1 | tee /tmp/sbx-test-output.log
      # Hosted runners often cannot create unprivileged user namespaces. Surface
      # every skip without treating it as a pass.
      - name: Report skipped sandbox tests
        if: always()
        run: |
          count=$(grep -c '^SKIPPED:' /tmp/sbx-test-output.log 2>/dev/null || true)
          if [ "${count:-0}" -gt 0 ]; then
            echo "::warning::${count} sandbox skip line(s); see the Tests log"
          fi
      - name: Doctor (informational)
        run: cargo run --quiet -p sbx-cli -- doctor || true
