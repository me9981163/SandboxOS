[workspace]
members = [
    "crates/sbx-core",
    "crates/sbx-sys",
    "crates/sbx-probe",
    "crates/sbx-runner",
    "crates/sbx-cli",
    "crates/sbx-escape",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/me9981163/SandboxOS"
publish = false

[workspace.dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
