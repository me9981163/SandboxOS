[package]
name = "sbx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The sbx command line interface"

[[bin]]
name = "sbx"
path = "src/main.rs"

[dependencies]
sbx-core = { path = "../sbx-core" }
sbx-probe = { path = "../sbx-probe" }
sbx-runner = { path = "../sbx-runner" }
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
sbx-sys = { path = "../sbx-sys" }

[features]
landlock-proof = ["sbx-runner/landlock-proof"]
